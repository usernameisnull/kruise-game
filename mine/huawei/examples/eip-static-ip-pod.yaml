apiVersion: v1
kind: Pod
metadata:
  annotations:
    yangtse.io/allocated-eip-id: fd096602-0625-448f-8447-22cae1647a01
    yangtse.io/allocated-ipv4-eip: 121.91.172.6
    yangtse.io/eip-bandwidth-size: "5"
    yangtse.io/eip-charge-mode: traffic
    yangtse.io/eip-network-type: 5_bgp
    yangtse.io/pod-with-eip: "true"
    yangtse.io/static-eip: "true"
    yangtse.io/static-eip-expire-duration: 5m
    yangtse.io/static-eip-expire-no-cascading: "false"
  generateName: static-sts-nginx-
  name: static-sts-nginx-pod
  namespace: kruise-game-system
spec:
  containers:
    - image: nginx:alpine
      imagePullPolicy: IfNotPresent
      name: container-0
      resources:
        limits:
          cpu: 100m
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 200Mi
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access-d8l4x
          readOnly: true
  dnsConfig:
    options:
      - name: single-request-reopen
        value: ""
      - name: timeout
        value: "2"
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  hostname: static-sts-nginx-0
  imagePullSecrets:
    - name: default-secret
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  subdomain: nginx
  terminationGracePeriodSeconds: 30
  tolerations:
    - effect: NoExecute
      key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 300
    - effect: NoExecute
      key: node.kubernetes.io/unreachable
      operator: Exists
      tolerationSeconds: 300
  volumes:
    - name: kube-api-access-d8l4x
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              items:
                - key: ca.crt
                  path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace