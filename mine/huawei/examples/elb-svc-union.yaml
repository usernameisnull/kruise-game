apiVersion: v1
kind: Service
metadata:
  name: only-svc-union
  namespace: kruise-game-system
  annotations:
    kubernetes.io/elb.id: ce9d34ad-ea3c-4e61-85f0-720069bc76e0                         # ELB ID，替换为实际值
    kubernetes.io/elb.class: union                        # 负载均衡器类型
    kubernetes.io/elb.lb-algorithm: ROUND_ROBIN                   # 负载均衡器算法
spec:
  selector:
    app: nginx
  ports:
    - name: service0
      port: 9989
      protocol: TCP
      targetPort: 80
  type: LoadBalancer