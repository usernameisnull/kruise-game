apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment   
  namespace: default       
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      restartPolicy: Always

---
apiVersion: v1 
kind: Service 
metadata: 
  name: nginx
  namespace: default
  annotations:
    kubernetes.io/elb.id: 8f4cf216-a659-40dc-8c77-6068b036ba56
    kubernetes.io/elb.class: performance
    kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
    kubernetes.io/elb.enterpriseID: 'E022-彭成博-4W'
spec:
  selector: 
     app: nginx
  ports: 
  - name: service0 
    port: 80
    protocol: TCP 
    targetPort: 80
  type: LoadBalancer